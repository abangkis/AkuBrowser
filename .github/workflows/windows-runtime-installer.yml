name: Windows Runtime Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing AkuBrowser release tag that receives the stable installer asset
        required: true
        default: v0.8.0
        type: string
      browser_ref:
        description: Frozen 40-character AkuBrowser commit SHA
        required: true
        type: string
      bridge_ref:
        description: Frozen 40-character AkuBridge commit SHA
        required: true
        type: string
      sidecar_ref:
        description: Frozen 40-character AkuSidecar commit SHA
        required: true
        type: string
      promote_latest:
        description: Promote only after the matching macOS installer, feed, and archive are already attached
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-signed-installer:
    runs-on: windows-2025
    env:
      AKU_WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
      C2PA_VERSION: "0.26.60"
      C2PA_SHA256: "90cbcebe30250f8e8c53416d32ed86065dc04a23be86e4a2337f5cd1badfa0b7"

    steps:
      - name: Check out AkuBrowser
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.browser_ref }}
          path: AkuWorkspace/AkuBrowser

      - name: Check out AkuBridge
        uses: actions/checkout@v4
        with:
          repository: abangkis/AkuBridge
          ref: ${{ inputs.bridge_ref }}
          token: ${{ secrets.AKU_WORKSPACE_READ_TOKEN || github.token }}
          path: AkuWorkspace/AkuBridge

      - name: Check out AkuSidecar
        uses: actions/checkout@v4
        with:
          repository: abangkis/AkuSidecar
          ref: ${{ inputs.sidecar_ref }}
          token: ${{ secrets.AKU_WORKSPACE_READ_TOKEN || github.token }}
          path: AkuWorkspace/AkuSidecar

      - name: Verify frozen source commits
        shell: pwsh
        env:
          BROWSER_REF: ${{ inputs.browser_ref }}
          BRIDGE_REF: ${{ inputs.bridge_ref }}
          SIDECAR_REF: ${{ inputs.sidecar_ref }}
        run: |
          $expected = [ordered]@{
            AkuBrowser = $env:BROWSER_REF
            AkuBridge = $env:BRIDGE_REF
            AkuSidecar = $env:SIDECAR_REF
          }
          $resolved = [ordered]@{}
          foreach ($repository in $expected.Keys) {
            if ([string]$expected[$repository] -cnotmatch '^[0-9a-f]{40}$') {
              throw "$repository ref must be one exact lowercase 40-character commit SHA."
            }
            $actual = (git -C "AkuWorkspace/$repository" rev-parse HEAD | Out-String).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$repository]) {
              throw "$repository resolved to $actual instead of frozen SHA $($expected[$repository])."
            }
            $resolved[$repository] = $actual
          }
          $resolved | ConvertTo-Json | Out-File -LiteralPath (Join-Path $env:RUNNER_TEMP "aku-release-source-shas.json") -Encoding utf8
          $resolved | ConvertTo-Json

      - name: Verify cross-component runtime identity
        shell: pwsh
        working-directory: AkuWorkspace/AkuBrowser
        run: node .\scripts\check-runtime-identity.mjs ..

      - name: Restore Authenticode certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "WINDOWS_CODE_SIGNING_PFX_BASE64 is required."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "akubrowser-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:PFX_BASE64)
          )
          "AKU_SIGNING_CERTIFICATE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore runtime update signing key
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.RUNTIME_UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
          UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.RUNTIME_UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:UPDATE_PUBLIC_KEY_BASE64)) {
            throw "Runtime update Ed25519 signing secrets are required."
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "akubrowser-runtime-update.key"
          [IO.File]::WriteAllText($keyPath, $env:UPDATE_PRIVATE_KEY_BASE64, [Text.UTF8Encoding]::new($false))
          "AKU_UPDATE_SIGNING_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AKU_UPDATE_PUBLIC_KEY=$env:UPDATE_PUBLIC_KEY_BASE64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download pinned c2patool
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "c2patool.zip"
          $destination = Join-Path $env:RUNNER_TEMP "c2patool"
          $url = "https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v$env:C2PA_VERSION/c2patool-v$env:C2PA_VERSION-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $tool = Get-ChildItem -LiteralPath $destination -Recurse -Filter "c2patool.exe" -File |
            Select-Object -First 1
          if ($null -eq $tool) {
            throw "Downloaded c2patool archive contains no Windows executable."
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tool.FullName).Hash.ToLowerInvariant()
          if ($hash -ne $env:C2PA_SHA256) {
            throw "Downloaded c2patool SHA-256 does not match the pinned release."
          }
          "AKU_C2PA_TOOL=$($tool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install pinned NSIS compiler
        shell: pwsh
        run: |
          choco install nsis --version 3.12.0 --yes --no-progress
          $compiler = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Pinned NSIS compiler was not installed."
          }
          "AKU_NSIS_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and sign runtime installer
        shell: pwsh
        working-directory: AkuWorkspace/AkuBrowser
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $release = Get-Content .\release\release-manifest.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -cnotmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$') {
            throw "release_tag must be one stable v<major>.<minor>.<patch> tag."
          }
          if ($env:RELEASE_TAG -ne "v$($release.components.akuSidecar.version)") {
            throw "release_tag must exactly match v$($release.components.akuSidecar.version) for an AkuSidecar release."
          }
          .\scripts\build-windows-runtime-installer.ps1 `
            -C2paToolPath $env:AKU_C2PA_TOOL `
            -NsisPath $env:AKU_NSIS_COMPILER `
            -CertificatePath $env:AKU_SIGNING_CERTIFICATE `
            -UpdatePublicKey $env:AKU_UPDATE_PUBLIC_KEY `
            -UpdateSigningPrivateKeyPath $env:AKU_UPDATE_SIGNING_KEY

      - name: Verify signed artifacts
        shell: pwsh
        working-directory: AkuWorkspace/AkuBrowser
        run: |
          $installer = Get-ChildItem .\artifacts\runtime-installer\AkuBrowserRuntimeSetup-*.exe |
            Where-Object { $_.Name -notlike "*unsigned*" } |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "Signed runtime installer was not produced."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Runtime installer Authenticode signature is not valid: $($signature.Status)"
          }
          Copy-Item -LiteralPath $installer.FullName `
            -Destination (Join-Path $installer.DirectoryName "AkuBrowserRuntimeSetup.exe")
          $versionedChecksum = "$($installer.FullName).sha256"
          if (-not (Test-Path -LiteralPath $versionedChecksum -PathType Leaf)) {
            throw "Versioned runtime installer checksum was not produced."
          }
          $stableChecksum = Join-Path $installer.DirectoryName "AkuBrowserRuntimeSetup.exe.sha256"
          $stableHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$stableHash  AkuBrowserRuntimeSetup.exe" | Set-Content -LiteralPath $stableChecksum -Encoding ASCII

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: AkuBrowserRuntimeSetup
          if-no-files-found: error
          path: |
            AkuWorkspace/AkuBrowser/artifacts/runtime-installer/AkuBrowserRuntimeSetup.exe
            AkuWorkspace/AkuBrowser/artifacts/runtime-installer/AkuBrowserRuntimeSetup-*.exe
            AkuWorkspace/AkuBrowser/artifacts/runtime-installer/*.sha256
            AkuWorkspace/AkuBrowser/artifacts/runtime-installer/AkuSidecar-*-windows-x64.zip
            AkuWorkspace/AkuBrowser/artifacts/runtime-installer/AkuSidecarUpdate.json
            AkuWorkspace/AkuBrowser/artifacts/runtime-installer/AkuBrowserRuntime-*-windows-x64.zip
            AkuWorkspace/AkuBrowser/artifacts/runtime-installer/AkuBrowserRuntimeUpdate.json

      - name: Publish stable release asset
        shell: pwsh
        working-directory: AkuWorkspace/AkuBrowser
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $release = Get-Content .\release\release-manifest.json -Raw | ConvertFrom-Json
          $runtimeZip = ".\artifacts\runtime-installer\AkuBrowserRuntime-$($release.version)-windows-x64.zip"
          $sidecarZip = ".\artifacts\runtime-installer\AkuSidecar-$($release.components.akuSidecar.version)-windows-x64.zip"
          $sidecarZipChecksum = "$sidecarZip.sha256"
          $versionedInstaller = ".\artifacts\runtime-installer\AkuBrowserRuntimeSetup-$($release.components.akuSidecar.version).exe"
          $assets = @(
            ".\artifacts\runtime-installer\AkuBrowserRuntimeSetup.exe",
            ".\artifacts\runtime-installer\AkuBrowserRuntimeSetup.exe.sha256",
            $versionedInstaller,
            "$versionedInstaller.sha256",
            $sidecarZip,
            $sidecarZipChecksum,
            ".\artifacts\runtime-installer\AkuSidecarUpdate.json"
          )
          if (Test-Path -LiteralPath $runtimeZip) {
            $assets += $runtimeZip
            $assets += "$runtimeZip.sha256"
            $assets += ".\artifacts\runtime-installer\AkuBrowserRuntimeUpdate.json"
          }
          if ($env:RELEASE_TAG -cnotmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$') {
            throw "release_tag must be one stable v<major>.<minor>.<patch> tag."
          }
          gh release view $env:RELEASE_TAG | Out-Null
          gh release upload $env:RELEASE_TAG @assets --clobber

      - name: Promote fully assembled cross-platform release
        if: ${{ inputs.promote_latest }}
        shell: pwsh
        working-directory: AkuWorkspace/AkuBrowser
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $release = Get-Content .\release\release-manifest.json -Raw | ConvertFrom-Json
          $sidecarVersion = [string]$release.components.akuSidecar.version
          $legacyFeedNames = @(
            "AkuBrowserRuntimeUpdate.json",
            "AkuBrowserRuntimeUpdate-macos-universal.json"
          )
          $legacyTupleIsAligned = (
            [string]$release.version -eq [string]$release.components.akuBridge.version -and
            [string]$release.version -eq [string]$release.components.akuSidecar.version -and
            [string]$release.components.akuBridge.runtimeRevision -eq [string]$release.components.akuSidecar.runtimeRevision
          )
          if ($env:RELEASE_TAG -cnotmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$') {
            throw "release_tag must be one stable v<major>.<minor>.<patch> tag."
          }
          $releaseView = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          $assetNames = @($releaseView.assets | ForEach-Object { [string]$_.name })
          $carryForward = Join-Path $env:RUNNER_TEMP "legacy-runtime-feed-carry-forward"
          if (-not $legacyTupleIsAligned) {
            New-Item -ItemType Directory -Force -Path $carryForward | Out-Null
            $previousLatest = gh release view --json tagName | ConvertFrom-Json
            if ([string]::IsNullOrWhiteSpace([string]$previousLatest.tagName) -or
                [string]$previousLatest.tagName -eq $env:RELEASE_TAG) {
              throw "A distinct previous Latest release is required to carry forward frozen v1 feeds."
            }
            foreach ($feedName in $legacyFeedNames) {
              gh release download $previousLatest.tagName --pattern $feedName --dir $carryForward --clobber
            }
            $legacyAssets = @($legacyFeedNames | ForEach-Object { Join-Path $carryForward $_ })
            gh release upload $env:RELEASE_TAG @legacyAssets --clobber
            $releaseView = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
            $assetNames = @($releaseView.assets | ForEach-Object { [string]$_.name })
          }
          $verifiedLegacy = Join-Path $env:RUNNER_TEMP "legacy-runtime-feed-verified"
          New-Item -ItemType Directory -Force -Path $verifiedLegacy | Out-Null
          foreach ($feedName in $legacyFeedNames) {
            gh release download $env:RELEASE_TAG --pattern $feedName --dir $verifiedLegacy --clobber
            $feedPath = Join-Path $verifiedLegacy $feedName
            go -C .\installer\windows run .\cmd\sign-update-manifest `
              -verify-signed $feedPath `
              -public-key $env:AKU_UPDATE_PUBLIC_KEY
            if ($LASTEXITCODE -ne 0) {
              throw "Legacy feed signature verification failed: $feedName"
            }
            $legacy = Get-Content -LiteralPath $feedPath -Raw | ConvertFrom-Json
            if ($legacy.schemaVersion -ne 1 -or $legacy.product -ne "AkuBrowser" -or
                $legacy.channel -ne "stable" -or $legacy.signature.algorithm -ne "ed25519" -or
                $legacy.signature.keyId -ne "aku-runtime-stable-v1" -or
                $legacy.signature.value -notmatch '^[A-Za-z0-9+/]{86}==$') {
              throw "Legacy feed is not the frozen signed v1 shape: $feedName"
            }
            $expectedPlatform = if ($feedName -eq "AkuBrowserRuntimeUpdate.json") { "windows-x64" } else { "macos-universal" }
            $artifactMatch = [regex]::Match(
              [string]$legacy.artifact.url,
              "^https://github.com/abangkis/AkuBrowser/releases/download/(?<tag>v[^/]+)/(?<asset>AkuBrowserRuntime-[^/]+-$expectedPlatform\.zip)$"
            )
            if (-not $artifactMatch.Success) {
              throw "Legacy feed artifact URL is not pinned to an immutable platform release: $feedName"
            }
            $artifactRelease = gh release view $artifactMatch.Groups['tag'].Value --json assets | ConvertFrom-Json
            $artifactNames = @($artifactRelease.assets | ForEach-Object { [string]$_.name })
            if ($artifactNames -notcontains $artifactMatch.Groups['asset'].Value) {
              throw "Legacy feed references a missing immutable archive: $feedName"
            }
            $sourcePath = Join-Path $carryForward $feedName
            if (Test-Path -LiteralPath $sourcePath) {
              $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash
              $targetHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $feedPath).Hash
              if ($sourceHash -ne $targetHash) {
                throw "Carried legacy feed changed bytes during upload: $feedName"
              }
            }
          }
          $requiredAssets = @(
            "AkuBrowserRuntimeSetup.exe",
            "AkuBrowserRuntimeSetup-$sidecarVersion.exe",
            "AkuBrowserRuntimeSetup-$sidecarVersion.exe.sha256",
            "AkuSidecar-$sidecarVersion-windows-x64.zip",
            "AkuSidecar-$sidecarVersion-windows-x64.zip.sha256",
            "AkuSidecarUpdate.json",
            "AkuBrowserRuntimeSetup.pkg",
            "AkuBrowserRuntimeSetup-$sidecarVersion-macos-universal.pkg",
            "AkuBrowserRuntimeSetup-$sidecarVersion-macos-universal.pkg.sha256",
            "AkuSidecar-$sidecarVersion-macos-universal.zip",
            "AkuSidecar-$sidecarVersion-macos-universal.zip.sha256",
            "AkuSidecarUpdate-macos-universal.json",
            "AkuBrowserRuntimeUpdate.json",
            "AkuBrowserRuntimeUpdate-macos-universal.json"
          )
          foreach ($requiredAsset in $requiredAssets) {
            if ($assetNames -notcontains $requiredAsset) {
              throw "Cannot promote Latest before the cross-platform asset is attached: $requiredAsset"
            }
          }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease=false --latest

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "akubrowser-code-signing.pfx"
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -Force
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "akubrowser-runtime-update.key"
          if (Test-Path -LiteralPath $keyPath) {
            Remove-Item -LiteralPath $keyPath -Force
          }
