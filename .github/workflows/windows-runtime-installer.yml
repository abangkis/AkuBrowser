name: Windows Runtime Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing AkuBrowser release tag that receives the stable installer asset
        required: true
        default: v0.7.8
        type: string
      source_ref:
        description: Matching source ref in AkuBrowser, AkuBridge, and AkuSidecar
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  build-signed-installer:
    runs-on: windows-2025
    env:
      AKU_WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
      C2PA_VERSION: "0.26.60"
      C2PA_SHA256: "90cbcebe30250f8e8c53416d32ed86065dc04a23be86e4a2337f5cd1badfa0b7"

    steps:
      - name: Check out AkuBrowser
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: AkuWorkspace/AkuBrowser

      - name: Check out AkuBridge
        uses: actions/checkout@v4
        with:
          repository: abangkis/AkuBridge
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.AKU_WORKSPACE_READ_TOKEN || github.token }}
          path: AkuWorkspace/AkuBridge

      - name: Check out AkuSidecar
        uses: actions/checkout@v4
        with:
          repository: abangkis/AkuSidecar
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.AKU_WORKSPACE_READ_TOKEN || github.token }}
          path: AkuWorkspace/AkuSidecar

      - name: Restore Authenticode certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "WINDOWS_CODE_SIGNING_PFX_BASE64 is required."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "akubrowser-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:PFX_BASE64)
          )
          "AKU_SIGNING_CERTIFICATE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore runtime update signing key
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.RUNTIME_UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
          UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.RUNTIME_UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:UPDATE_PUBLIC_KEY_BASE64)) {
            throw "Runtime update Ed25519 signing secrets are required."
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "akubrowser-runtime-update.key"
          [IO.File]::WriteAllText($keyPath, $env:UPDATE_PRIVATE_KEY_BASE64, [Text.UTF8Encoding]::new($false))
          "AKU_UPDATE_SIGNING_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AKU_UPDATE_PUBLIC_KEY=$env:UPDATE_PUBLIC_KEY_BASE64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download pinned c2patool
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "c2patool.zip"
          $destination = Join-Path $env:RUNNER_TEMP "c2patool"
          $url = "https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v$env:C2PA_VERSION/c2patool-v$env:C2PA_VERSION-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $tool = Get-ChildItem -LiteralPath $destination -Recurse -Filter "c2patool.exe" -File |
            Select-Object -First 1
          if ($null -eq $tool) {
            throw "Downloaded c2patool archive contains no Windows executable."
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tool.FullName).Hash.ToLowerInvariant()
          if ($hash -ne $env:C2PA_SHA256) {
            throw "Downloaded c2patool SHA-256 does not match the pinned release."
          }
          "AKU_C2PA_TOOL=$($tool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install pinned NSIS compiler
        shell: pwsh
        run: |
          choco install nsis --version 3.12.0 --yes --no-progress
          $compiler = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Pinned NSIS compiler was not installed."
          }
          "AKU_NSIS_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and sign runtime installer
        shell: pwsh
        working-directory: AkuWorkspace/AkuBrowser
        run: |
          $release = Get-Content .\release\release-manifest.json -Raw | ConvertFrom-Json
          if ("${{ inputs.release_tag }}" -ne "v$($release.version)") {
            throw "release_tag must exactly match v$($release.version)."
          }
          .\scripts\build-windows-runtime-installer.ps1 `
            -C2paToolPath $env:AKU_C2PA_TOOL `
            -NsisPath $env:AKU_NSIS_COMPILER `
            -CertificatePath $env:AKU_SIGNING_CERTIFICATE `
            -UpdatePublicKey $env:AKU_UPDATE_PUBLIC_KEY `
            -UpdateSigningPrivateKeyPath $env:AKU_UPDATE_SIGNING_KEY

      - name: Verify signed artifacts
        shell: pwsh
        working-directory: AkuWorkspace/AkuBrowser
        run: |
          $installer = Get-ChildItem .\artifacts\runtime-installer\AkuBrowserRuntimeSetup-*.exe |
            Where-Object { $_.Name -notlike "*unsigned*" } |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "Signed runtime installer was not produced."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Runtime installer Authenticode signature is not valid: $($signature.Status)"
          }
          Copy-Item -LiteralPath $installer.FullName `
            -Destination (Join-Path $installer.DirectoryName "AkuBrowserRuntimeSetup.exe")

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: AkuBrowserRuntimeSetup
          if-no-files-found: error
          path: |
            AkuWorkspace/AkuBrowser/artifacts/runtime-installer/AkuBrowserRuntimeSetup.exe
            AkuWorkspace/AkuBrowser/artifacts/runtime-installer/*.sha256
            AkuWorkspace/AkuBrowser/artifacts/runtime-installer/AkuBrowserRuntime-*-windows-x64.zip
            AkuWorkspace/AkuBrowser/artifacts/runtime-installer/AkuBrowserRuntimeUpdate.json

      - name: Publish stable release asset
        shell: pwsh
        working-directory: AkuWorkspace/AkuBrowser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Get-Content .\release\release-manifest.json -Raw | ConvertFrom-Json
          $runtimeZip = ".\artifacts\runtime-installer\AkuBrowserRuntime-$($release.version)-windows-x64.zip"
          gh release view "${{ inputs.release_tag }}" | Out-Null
          gh release upload "${{ inputs.release_tag }}" `
            .\artifacts\runtime-installer\AkuBrowserRuntimeSetup.exe `
            $runtimeZip `
            .\artifacts\runtime-installer\AkuBrowserRuntimeUpdate.json `
            --clobber

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "akubrowser-code-signing.pfx"
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -Force
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "akubrowser-runtime-update.key"
          if (Test-Path -LiteralPath $keyPath) {
            Remove-Item -LiteralPath $keyPath -Force
          }
